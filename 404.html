<!doctype html>
<html lang="en-GB" data-root="/" data-glossary="off" data-no-recent>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Mr Lane's Physics Lab</title>
  <!-- GitHub Pages shows this page for any address that doesn't exist, at that address,
       so every link here starts with / rather than being relative. -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Physics Lab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Page not found</h1>
      <p>There’s no page at this address. The link may have a typo in it, or the page may have moved.</p>
    </div>
    <div class="panel">
      <p id="guess" style="margin-top:0" hidden></p>
      <div class="btn-row"><a class="btn primary" href="/">See all the tools</a></div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/catalogue.js"></script>
  <script>
    PK.header({ title: 'Page not found' });

    // Suggest the tool whose address or name is closest to the one typed
    (() => {
      const typed = decodeURIComponent(location.pathname.split('/').pop() || '').replace(/\.html?$/i, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (typed.length < 3) return;
      const dist = (a, b) => {
        const d = Array.from({ length: b.length + 1 }, (_, j) => j);
        for (let i = 1; i <= a.length; i++) {
          let prev = d[0];
          d[0] = i;
          for (let j = 1; j <= b.length; j++) {
            const keep = d[j];
            d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
            prev = keep;
          }
        }
        return d[b.length];
      };
      let best = null, bestScore = Infinity;
      for (const t of TOOLS) {
        if (!t.href || t.href.includes('#')) continue;
        const file = t.href.split('/').pop().replace('.html', '').replace(/[^a-z0-9]/g, '');
        const name = t.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        const score = Math.min(dist(typed, file) / Math.max(typed.length, file.length), dist(typed, name) / Math.max(typed.length, name.length));
        if (score < bestScore) { bestScore = score; best = t; }
      }
      if (!best || bestScore > 0.4) return;
      const guess = document.getElementById('guess');
      const a = document.createElement('a');
      a.href = '/' + best.href;
      a.textContent = best.name;
      guess.append('Did you mean ', a, '?');
      guess.hidden = false;
    })();
  </script>
</body>
</html>
