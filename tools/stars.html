  <style>
    #scene { display: block; width: 100%; aspect-ratio: 800 / 470; }
    .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
    #info p, #explain p { margin: 0 0 8px; line-height: 1.5; }
    #info p:last-child, #explain p:last-child { margin-bottom: 0; }
    #explain ul { margin: 0 0 8px; padding-left: 20px; }
    #explain li { margin-bottom: 4px; line-height: 1.5; }

    .set-label { font-size: .88rem; font-weight: 700; color: var(--muted); margin: 0 0 6px; }

<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Stars, galaxies &amp; light years</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="stars" aria-pressed="true">The Sun &amp; other stars</button>
      <button class="chip" data-t="galaxy" aria-pressed="false">Galaxies</button>
      <button class="chip" data-t="ly" aria-pressed="false">Light years</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" aria-label="The Sun and another star drawn to the same scale"></canvas>
          <div class="stage-bar" data-for="galaxy" hidden>
            <button class="btn primary" id="zout">⊖ Zoom out</button>
            <button class="btn" id="zin">⊕ Zoom in</button>
          </div>
          <div class="stage-bar" data-for="ly" hidden>
            <button class="btn primary" id="send">▶ Send the light again</button>
          </div>
        </div>
        <div class="panel after-aside">
          <h2>How it works</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="stars">
          <h2>Set up</h2>
          <p class="set-label">Star</p><div class="chip-group" id="star" aria-label="Star"><button class="chip" data-v="sun" aria-pressed="true">The Sun</button><button class="chip" data-v="proxima" aria-pressed="false">Proxima Centauri</button><button class="chip" data-v="sirius" aria-pressed="false">Sirius</button><button class="chip" data-v="rigel" aria-pressed="false">Rigel</button><button class="chip" data-v="betelgeuse" aria-pressed="false">Betelgeuse</button></div>
        </div>
        <div class="panel" data-for="galaxy" hidden>
          <h2>Set up</h2>
          <p class="set-label">Show</p><div class="chip-group" id="gview" aria-label="Show" style="margin-bottom:12px"><button class="chip" data-v="milky" aria-pressed="true">The Milky Way</button><button class="chip" data-v="local" aria-pressed="false">The Local Group</button><button class="chip" data-v="super" aria-pressed="false">Our supercluster</button><button class="chip" data-v="universe" aria-pressed="false">The whole universe</button><button class="chip" data-v="deep" aria-pressed="false">Galaxy shapes</button></div>
          <p class="note" style="margin:0">Zoom out to go from our galaxy to the whole universe. Each step is drawn to scale.</p>
        </div>
        <div class="panel" data-for="ly" hidden>
          <h2>Set up</h2>
          <p class="set-label">How long the light travels for</p><div class="chip-group" id="span" aria-label="How long the light travels for"><button class="chip" data-v="s1" aria-pressed="true">1 second</button><button class="chip" data-v="m1" aria-pressed="false">1 minute</button><button class="chip" data-v="m8" aria-pressed="false">8⅓ minutes</button><button class="chip" data-v="h1" aria-pressed="false">1 hour</button><button class="chip" data-v="d1" aria-pressed="false">1 day</button><button class="chip" data-v="y1" aria-pressed="false">1 year</button><button class="chip" data-v="y4" aria-pressed="false">4.24 years</button></div>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/common.js"></script>

  <script src="../js/quiz-pages/stars.js"></script>
  <script src="../js/practice-tab.js"></script>
</body>
