<!doctype html>
<html lang="en-GB" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculation Practice · Mr Lane's Physics Lab</title>
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .q-panel { font-size: 1.15rem; }
    .q-panel .tags { gap: 4px; margin-bottom: 8px; }
    .tag.recall { background: var(--t-forces); color: #fff; }
    .tag.given { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .ctx { margin: 0 0 10px; }
    .givens { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
    .givens li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--radius-sm); }
    .givens b { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ask { margin: 0 0 4px; }
    .eq-show { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.3rem; padding: 8px 12px; margin: 6px 0; background: var(--surface-2); border-radius: var(--radius-sm); text-align: center; line-height: 1.3; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; }
    .frac > span { padding: 0 .2em; }
    .frac > span:first-child { border-bottom: 2px solid currentColor; }
    .answer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
    .answer-row input { min-height: 46px; font-size: 1.15rem; padding: 4px 10px; width: 180px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
    .answer-box { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .answer-row .u { font-weight: 700; min-width: 2ch; }
    .feedback { margin-top: 10px; min-height: 1.4em; font-weight: 700; }
    .feedback.good { color: #2e7d32; }
    .feedback.bad { color: #c62828; }
    [data-theme="dark"] .feedback.good { color: #81c784; }
    [data-theme="dark"] .feedback.bad { color: #ef9a9a; }
    .steps { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; }
    .steps .ans { font-size: 1.25rem; font-weight: 800; color: var(--answer, inherit); }
    .setting { display: grid; gap: 4px; margin-bottom: 10px; font-weight: 700; font-size: .9rem; color: var(--muted); }
    .setting .select { width: 100%; }
    aside .toggle { margin-top: 6px; }
  </style>
</head>
<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Calculation practice</h1>
      <p>A new question every time, using the equations in AQA GCSE Physics. Type your answer, then check it. Stuck? Show the equation, or the full worked answer.</p>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel q-panel">
          <div id="question"></div>
          <div class="answer-row">
            <label class="sr-only" for="answer">Your answer</label>
            <span class="answer-box"><input id="answer" inputmode="decimal" autocomplete="off" placeholder="Your answer"> <span class="u" id="unit"></span></span>
            <button class="btn primary" id="check">Check</button>
            <button class="btn" id="next">Next question →</button>
          </div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn" id="show-hint">Show the equation</button>
            <button class="btn" id="show-working">Show the worked answer</button>
          </div>
          <div id="hint" hidden style="margin-top:10px"></div>
        </div>
        <div class="panel after-aside" id="working" hidden></div>
      </div>
      <aside>
        <div class="panel">
          <h2>Score</h2>
          <p id="score" style="margin:0"></p>
          <div class="btn-row" style="margin-top:8px"><button class="btn" id="reset-score">Reset score</button></div>
        </div>
        <div class="panel">
          <h2>Questions</h2>
          <div class="chip-group" id="course" style="margin-bottom:10px">
            <button class="chip" data-v="physics" aria-pressed="true">GCSE Physics</button>
            <button class="chip" data-v="combined" aria-pressed="false">Combined</button>
          </div>
          <label class="setting">Topic<select class="select" id="topic"></select></label>
          <label class="setting">Equation<select class="select" id="eq"></select></label>
          <label class="toggle"><input type="checkbox" id="higher"> Higher tier</label>
          <label class="toggle"><input type="checkbox" id="rearrange"> Include rearranging</label>
          <label class="toggle"><input type="checkbox" id="convert"> Include unit conversions</label>
          <label class="toggle"><input type="checkbox" id="showEq"> Always show the equation</label>
          <p class="note">Answers within 1% are marked correct, so 3 significant figures is fine. Use g = 9.8 N/kg.</p>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/equations-data.js"></script>
  <script src="../js/practice.js"></script>
</body>
</html>
