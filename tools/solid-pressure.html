<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Pressure on solids</h1>
      <p><b>Pressure = force ÷ area.</b> The same force pushing on a small area gives a big pressure, and on a big area gives a small pressure. That’s why snowshoes keep you on top of the snow, and a stiletto heel sinks straight in.</p>
    </div>


    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" aria-label="A person walking on snow, sinking in by an amount that depends on the pressure under their foot"></canvas>
          <p class="note status" id="status" aria-live="polite"></p>
        </div>
        <div class="panel after-aside">
          <h2>Why?</h2>
          <div id="explain" class="hide-when-no-answers"></div>
        </div>
      </div>
      <aside>
        <div class="panel">
          <h2>Set-up</h2>
          <div class="field"><span class="label">What’s on your foot</span>
            <div class="chip-group" id="shoe" aria-label="What’s on your foot">
              <button class="chip" data-v="0" aria-pressed="true">Trainer</button>
              <button class="chip" data-v="1" aria-pressed="false">Snowshoe</button>
              <button class="chip" data-v="2" aria-pressed="false">Ski</button>
              <button class="chip" data-v="3" aria-pressed="false">Stiletto heel</button>
            </div>
          </div>
          <div class="num-row"><label for="force">Your weight (force)</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: weight">−</button><input type="number" id="force" min="100" max="1500" step="any" data-inc="50" value="600" inputmode="decimal"><span class="unit">N</span><button data-step="1" aria-label="More: weight">+</button></div></div>
          <div class="num-row" style="margin-bottom:0"><label for="area">Area touching the snow</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: area">−</button><input type="number" id="area" min="1" max="3000" step="any" data-inc="10" value="250" inputmode="decimal"><span class="unit">cm²</span><button data-step="1" aria-label="More: area">+</button></div></div>
        </div>
        <div class="panel">
          <h2>Working it out</h2>
          <div id="work"></div>
        </div>
      </aside>
    </div>
  </main>
