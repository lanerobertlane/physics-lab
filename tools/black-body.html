<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Black body radiation &amp; the greenhouse effect</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="spectrum" aria-pressed="true">Hotter objects</button>
      <button class="chip" data-t="balance" aria-pressed="false">Absorbing and emitting</button>
      <button class="chip" data-t="greenhouse" aria-pressed="false">The greenhouse effect</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" aria-label="The object and the radiation it gives out"></canvas>
          <div class="stage-bar" id="bar">
            <button class="btn" id="reset">↺ Reset</button>
          </div>
        </div>
        <div class="panel after-aside" id="graph-panel">
          <h2 id="graph-title">Radiation given out at each wavelength</h2>
          <canvas id="graph" class="drag" aria-label="Graph"></canvas>
          <p class="note" id="graph-note"></p>
        </div>
        <div class="panel after-aside">
          <h2>Why?</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="spectrum">
          <h2>Set-up</h2>
          <div class="num-row"><label for="tc">Temperature of the object</label><div class="stepper" data-num><button data-step="-1" aria-label="Cooler">−</button><input type="number" id="tc" min="2500" max="6000" step="any" data-inc="250" data-whole value="4000" inputmode="numeric"><span class="unit">°C</span><button data-step="1" aria-label="Hotter">+</button></div></div>
          <div class="field" style="margin-bottom:0"><span class="label">Examples</span>
            <div class="chip-group" id="egs" aria-label="Examples">
              <button class="chip" data-v="2500" aria-pressed="false">Lamp filament</button>
              <button class="chip" data-v="3000" aria-pressed="false">A red star</button>
              <button class="chip" data-v="5500" aria-pressed="false">The Sun</button>
            </div></div>
        </div>
        <div class="panel" data-for="balance" hidden>
          <h2>Set-up</h2>
          <div class="field" style="margin-bottom:0"><span class="label">The lamp</span>
            <div class="chip-group" id="lamp" aria-label="The lamp">
              <button class="chip" data-v="0" aria-pressed="false">Off</button>
              <button class="chip" data-v="1" aria-pressed="false">Dim</button>
              <button class="chip" data-v="2" aria-pressed="true">Bright</button>
            </div></div>
        </div>
        <div class="panel" data-for="greenhouse" hidden>
          <h2>Set-up</h2>
          <div class="field"><span class="label">Greenhouse gases in the atmosphere</span>
            <div class="chip-group" id="ghg" aria-label="Greenhouse gases">
              <button class="chip" data-v="0" aria-pressed="false">None</button>
              <button class="chip" data-v="1" aria-pressed="false">Half today’s</button>
              <button class="chip" data-v="2" aria-pressed="true">Today’s</button>
              <button class="chip" data-v="3" aria-pressed="false">Double today’s</button>
            </div></div>
          <div class="field" style="margin-bottom:0"><span class="label">Ice and cloud reflecting sunlight</span>
            <div class="chip-group" id="albedo" aria-label="Ice and cloud">
              <button class="chip" data-v="0" aria-pressed="false">Less</button>
              <button class="chip" data-v="1" aria-pressed="true">Today</button>
              <button class="chip" data-v="2" aria-pressed="false">More</button>
            </div></div>
        </div>
        <div class="panel">
          <h2 id="info-title">What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
  </main>
