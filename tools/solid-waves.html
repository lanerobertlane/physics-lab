  <style>
    #scene { display: block; width: 100%; aspect-ratio: 800 / 360; }
    .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
    .stage-bar .spacer { flex: 1; }
    #info p, #method p { margin: 0 0 8px; line-height: 1.5; }
    #info p:last-child { margin-bottom: 0; }
    .readout dd { white-space: nowrap; }
    .results { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; font-size: .88rem; }
    .results th, .results td { border: 1px solid var(--border-strong); padding: 4px 5px; text-align: center; }
    .results th { background: var(--surface-2); }
    .results .del { border: 0; background: none; color: var(--muted); cursor: pointer; }

<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Waves in a solid</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="string" aria-pressed="true">Vibrating string</button>
      <button class="chip" data-t="rod" aria-pressed="false">Metal rod</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="A string stretched between a vibration generator and a pulley"></canvas>
          <div class="stage-bar">
            <div class="chip-group" id="view" data-for="string" aria-label="View"><button class="chip" data-v="blur" aria-pressed="true">As you see it</button><button class="chip" data-v="slow" aria-pressed="false">Slow motion</button></div>
            <button class="btn primary" id="tap" data-for="rod" hidden>🔨 Tap the end of the rod</button>
          </div>
        </div>
        <div class="panel after-aside">
          <h2>Required practical: method</h2>
          <div id="method"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="string">
          <h2>Set up</h2>
          <div class="num-row"><label for="freq">Signal generator frequency</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: frequency">−</button><input type="number" id="freq" min="5" max="120" step="any" data-inc="1" value="10" inputmode="decimal"><span class="unit">Hz</span><button data-step="1" aria-label="More: frequency">+</button></div></div>
          <div class="num-row"><label for="mass">Hanging mass</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: hanging mass">−</button><input type="number" id="mass" min="50" max="500" step="any" data-inc="50" value="200" inputmode="decimal" data-whole><span class="unit">g</span><button data-step="1" aria-label="More: hanging mass">+</button></div></div>
          <div class="num-row"><label for="len">Length of string vibrating</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: length">−</button><input type="number" id="len" min="0.6" max="1.5" step="any" data-inc="0.1" value="1.2" inputmode="decimal"><span class="unit">m</span><button data-step="1" aria-label="More: length">+</button></div></div>
          <p class="note" style="margin:0">You can also drag the vibration generator along the bench.</p>
        </div>
        <div class="panel" data-for="rod" hidden>
          <h2>Set up</h2>
          <div class="field"><label for="metal">Metal</label>
            <select class="select" id="metal">
              <option value="steel">Steel</option>
              <option value="aluminium">Aluminium</option>
              <option value="brass">Brass</option>
              <option value="copper">Copper</option>
            </select></div>
          <div class="num-row"><label for="rlen">Length of the rod</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: length of the rod">−</button><input type="number" id="rlen" min="0.5" max="1.5" step="any" data-inc="0.1" value="1.0" inputmode="decimal"><span class="unit">m</span><button data-step="1" aria-label="More: length of the rod">+</button></div></div>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
        <div class="panel">
          <h2>Results</h2>
          <div class="btn-row">
            <button class="btn primary" id="record">＋ Record reading</button>
            <button class="btn" id="clear-results">Clear</button>
          </div>
          <div id="table"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/solid-waves.js"></script>
