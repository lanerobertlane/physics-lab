<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Pinhole camera &amp; the eye</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="camera" aria-pressed="true">Pinhole camera</button>
      <button class="chip" data-t="eye" aria-pressed="false">The eye</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="A candle and a pinhole camera"></canvas>
        </div>
        <div class="panel after-aside">
          <h2>How it works</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="camera">
          <h2>Set up</h2>
          <p class="set-label">The hole</p><div class="chip-group" id="hole" aria-label="The hole" style="margin-bottom:12px"><button class="chip" data-v="small" aria-pressed="true">Small</button><button class="chip" data-v="big" aria-pressed="false">Big</button><button class="chip" data-v="lens" aria-pressed="false">Big, with a lens</button></div>
          <p class="note" style="margin:0">Drag the candle, or the back of the camera, to move them.</p>
        </div>
        <div class="panel" data-for="eye" hidden>
          <h2>Set up</h2>
          <p class="set-label">Looking at</p><div class="chip-group" id="dist" aria-label="Looking at" style="margin-bottom:12px"><button class="chip" data-v="far" aria-pressed="true">A tree far away</button><button class="chip" data-v="near" aria-pressed="false">A book close up</button></div>
          <p class="set-label">Light</p><div class="chip-group" id="lightlvl" aria-label="Light" style="margin-bottom:12px"><button class="chip" data-v="bright" aria-pressed="true">Bright</button><button class="chip" data-v="dim" aria-pressed="false">Dim</button></div>
          <label class="toggle" style="margin-bottom:0"><input type="checkbox" id="focus" checked> Let the lens change shape to focus</label>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
