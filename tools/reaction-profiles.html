    #graph { display: block; width: 100%; aspect-ratio: 560 / 340; }
    .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
    .results { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
    .results th, .results td { border: 1px solid var(--border-strong); padding: 4px 6px; text-align: center; }

<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Reaction profiles &amp; energy changes</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="profile" aria-pressed="true">Reaction profiles</button>
      <button class="chip" data-t="temp" aria-pressed="false">Temperature change</button>
      <button class="chip" data-t="bonds" aria-pressed="false">Bond energies (Higher)</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="A reaction profile"></canvas>
          <div class="stage-bar">
            <button class="btn primary" id="go">▶ Run the reaction</button>
            <button class="btn" id="reset">↺ Reset</button>
          </div>
        </div>
        <div class="panel after-aside" id="graph-panel" hidden>
          <h2>Temperature against volume added</h2>
          <canvas id="graph" aria-label="Graph of the temperature against the amount added"></canvas>
          <p class="note" id="graph-note"></p>
        </div>
        <div class="panel after-aside">
          <h2>Why?</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="profile">
          <h2>Set-up</h2>
          <div class="field"><label for="example">Example</label>
            <select class="select" id="example"></select></div>
          <label class="toggle" style="margin-bottom:0"><input type="checkbox" id="catalyst"> Show the path with a catalyst</label>
        </div>
        <div class="panel" data-for="profile">
          <h2>What the profile shows</h2>
          <div id="profile-info"></div>
        </div>

        <div class="panel" data-for="temp" hidden>
          <h2>Set-up</h2>
          <div class="field"><label for="treact">Reaction</label>
            <select class="select" id="treact">
              <option value="neut">Hydrochloric acid + sodium hydroxide</option>
              <option value="citric">Citric acid + sodium hydrogencarbonate</option>
            </select></div>
          <label class="toggle"><input type="checkbox" id="lid" checked> Lid on the cup</label>
          <p class="note" id="tsetup" style="margin:0"></p>
        </div>
        <div class="panel" data-for="temp" hidden>
          <h2>Results</h2>
          <div id="tresults"></div>
        </div>

        <div class="panel" data-for="bonds" hidden>
          <h2>Reaction</h2>
          <div class="field" style="margin-bottom:0"><label for="breact">Reaction</label>
            <select class="select" id="breact"></select></div>
        </div>
        <div class="panel" data-for="bonds" hidden>
          <h2>Working</h2>
          <div id="bwork"></div>
        </div>
        <div class="panel" data-for="bonds" hidden>
          <h2>Bond energies (kJ/mol)</h2>
          <div id="btable"></div>
        </div>
      </aside>
    </div>
  </main>
