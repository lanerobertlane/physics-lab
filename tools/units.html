<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Units, prefixes &amp; standard form</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="prefixes" aria-pressed="true">Prefixes</button>
      <button class="chip" data-t="sform" aria-pressed="false">Standard form</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" aria-label="A ladder of prefixes"></canvas>
        </div>
        <div class="panel after-aside">
          <h2>Why?</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="prefixes">
          <h2>Set-up</h2>
          <div class="num-row"><label for="val">Value</label><div class="stepper" data-num><button data-step="-1" aria-label="Less">−</button><input type="number" id="val" step="any" data-inc="1" value="4.7" inputmode="decimal"><span class="unit" id="val-unit">kΩ</span><button data-step="1" aria-label="More">+</button></div></div>
          <div class="field"><label for="unit">Unit</label>
            <select class="select" id="unit"></select></div>
          <div class="two">
            <div class="field"><label for="from">From</label><select class="select" id="from"></select></div>
            <div class="field"><label for="to">To</label><select class="select" id="to"></select></div>
          </div>
          <div class="field" style="margin-bottom:0"><span class="label">Examples</span>
            <div class="chip-group" id="pegs" aria-label="Examples"></div></div>
        </div>

        <div class="panel" data-for="sform" hidden>
          <h2>Set-up</h2>
          <div class="field"><span class="label">Which way?</span>
            <div class="chip-group" id="dir" aria-label="Which way">
              <button class="chip" data-v="0" aria-pressed="true">A number → standard form</button>
              <button class="chip" data-v="1" aria-pressed="false">Standard form → a number</button>
            </div></div>
          <div class="field" id="num-field"><label for="big">The number</label>
            <div class="answer-row" style="margin:4px 0 0"><input type="number" id="big" step="any" inputmode="decimal" value="0.00034" style="width:100%"></div></div>
          <div class="field" id="sf-field" hidden><span class="label">In standard form</span>
            <div class="sf-row" style="margin-top:4px"><input class="a" type="number" id="sfa" step="any" inputmode="decimal" value="3.4" aria-label="The number from 1 to 10"><span>× 10</span><input class="n" type="number" id="sfn" step="1" inputmode="numeric" value="-4" aria-label="The power of ten"></div></div>
          <div class="field" style="margin-bottom:0"><span class="label">Examples</span>
            <div class="chip-group" id="segs" aria-label="Examples"></div></div>
        </div>

        <div class="panel">
          <h2 id="info-title">What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
  </main>
