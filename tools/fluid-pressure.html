<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Pressure in fluids &amp; upthrust</h1>
      <p>Liquids and gases push on every surface they touch, at right angles to it. In a liquid the pressure gets bigger the deeper you go, because there’s more liquid above pushing down.</p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Example">
      <button class="chip" data-t="dam" aria-pressed="true">Dam</button>
      <button class="chip" data-t="spouts" aria-pressed="false">Tower with three spouts</button>
      <button class="chip" data-t="float" aria-pressed="false">Floating and sinking</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="The example for this tab. The words underneath say what to drag or tap."></canvas>
          <p class="note status" id="status" aria-live="polite"></p>
        </div>
        <div class="panel after-aside">
          <h2 id="exp-title">Why?</h2>
          <div id="explain" class="hide-when-no-answers"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="dam">
          <h2>Set-up</h2>
          <div class="num-row"><label for="depth">Depth of water</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: depth of water">−</button><input type="number" id="depth" min="10" max="68" step="any" data-inc="1" data-whole value="50" inputmode="numeric"><span class="unit">m</span><button data-step="1" aria-label="More: depth of water">+</button></div></div>
          <div class="field"><label for="liquid">Liquid behind the dam</label>
            <select class="select" id="liquid"><option value="water">Fresh water (1000 kg/m³)</option><option value="sea">Sea water (1030 kg/m³)</option><option value="oil">Oil (910 kg/m³)</option></select></div>
          <label class="toggle" style="margin-bottom:0"><input type="checkbox" id="two"> Use two sensors</label>
        </div>
        <div class="panel" data-for="spouts" hidden>
          <h2>Set-up</h2>
          <label class="toggle"><input type="checkbox" id="full" checked> Keep the tank topped up</label>
          <button class="btn" id="refill">Fill the tank</button>
        </div>
        <div class="panel" data-for="float" hidden>
          <h2>Set-up</h2>
          <div class="field"><label for="fliquid">Liquid in the tank</label>
            <select class="select" id="fliquid"><option value="water">Water (1000 kg/m³)</option><option value="salty">Very salty water (1200 kg/m³)</option><option value="alcohol">Alcohol (790 kg/m³)</option></select></div>
          <label class="toggle"><input type="checkbox" id="faces"> Show the pressure on each face</label>
          <button class="btn" id="tidy">Put everything back</button>
        </div>
        <div class="panel">
          <h2 id="work-title">Pressure</h2>
          <div id="work"></div>
        </div>
      </aside>
    </div>
