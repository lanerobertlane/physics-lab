    #scene { display: block; width: 100%; aspect-ratio: 800 / 420; }

<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Colour &amp; filters</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="filters" aria-pressed="true">Filters and a prism</button>
      <button class="chip" data-t="objects" aria-pressed="false">Coloured objects</button>
      <button class="chip" data-t="surfaces" aria-pressed="false">Smooth, rough and see-through</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" aria-label="White light passing through colour filters and a prism onto a screen"></canvas>
        </div>
        <div class="panel after-aside">
          <h2>How it works</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="filters">
          <h2>Set up</h2>
          <div class="field"><label for="f1">First filter</label><select class="select" id="f1"><option value="none">No filter</option><option value="red">Red</option><option value="green">Green</option><option value="blue">Blue</option><option value="yellow">Yellow</option><option value="cyan">Cyan</option><option value="magenta">Magenta</option></select></div>
          <div class="field" style="margin-bottom:0"><label for="f2">Second filter</label><select class="select" id="f2"><option value="none">No filter</option><option value="red">Red</option><option value="green">Green</option><option value="blue">Blue</option><option value="yellow">Yellow</option><option value="cyan">Cyan</option><option value="magenta">Magenta</option></select></div>
        </div>
        <div class="panel" data-for="objects" hidden>
          <h2>Set up</h2>
          <p class="set-label">Colour of the light</p>
          <div class="chip-group" id="light" aria-label="Colour of the light" style="margin-bottom:12px"><button class="chip" data-v="white" aria-pressed="true">White</button><button class="chip" data-v="red" aria-pressed="false">Red</button><button class="chip" data-v="green" aria-pressed="false">Green</button><button class="chip" data-v="blue" aria-pressed="false">Blue</button><button class="chip" data-v="yellow" aria-pressed="false">Yellow</button><button class="chip" data-v="cyan" aria-pressed="false">Cyan</button><button class="chip" data-v="magenta" aria-pressed="false">Magenta</button></div>
          <div class="field" style="margin-bottom:0"><label for="eyef">Look at them through</label><select class="select" id="eyef"><option value="none">No filter (just your eyes)</option><option value="red">Red</option><option value="green">Green</option><option value="blue">Blue</option><option value="yellow">Yellow</option><option value="cyan">Cyan</option><option value="magenta">Magenta</option></select></div>
        </div>
        <div class="panel" data-for="surfaces" hidden>
          <h2>Set up</h2>
          <p class="set-label">The light hits</p>
          <div class="chip-group" id="surface" aria-label="Surface" style="margin-bottom:0"><button class="chip" data-v="smooth" aria-pressed="true">Smooth (mirror)</button><button class="chip" data-v="rough" aria-pressed="false">Rough (paper)</button><button class="chip" data-v="transparent" aria-pressed="false">Transparent (glass)</button><button class="chip" data-v="translucent" aria-pressed="false">Translucent (frosted glass)</button><button class="chip" data-v="opaque" aria-pressed="false">Opaque (wood)</button></div>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/common.js"></script>
