<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Newton’s first law &amp; inertia</h1>
      <p id="intro"></p>
    </div>

    <!-- Only the Inertial mass tab is shown for now. Remove hidden from the tab bar and the two buttons to bring the others back. -->
    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show" hidden>
      <button class="chip" data-t="move" aria-pressed="false" hidden>Keep moving</button>
      <button class="chip" data-t="coin" aria-pressed="false" hidden>Inertia: the coin trick</button>
      <button class="chip" data-t="mass" aria-pressed="true">Inertial mass</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="A box sliding along a floor, with the forces on it"></canvas>
          <div class="stage-bar">
            <button class="btn primary" id="push" data-for="move">▶ Give it a push</button>
            <button class="btn primary" id="flick" data-for="coin" hidden>Flick it fast</button>
            <button class="btn" id="pull" data-for="coin" hidden>Pull it slowly</button>
            <button class="btn primary" id="push1" data-for="mass" hidden>▶ Push for 1 second</button>
            <span class="spacer"></span>
            <button class="btn" id="reset">↺ Reset</button>
          </div>
        </div>
        <div class="panel after-aside">
          <h2>How it works</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="move">
          <h2>Set up</h2>
          <p class="set-label">Surface</p><div class="chip-group" id="surface" aria-label="Surface"><button class="chip" data-v="carpet" aria-pressed="true">Carpet</button><button class="chip" data-v="wood" aria-pressed="false">Wood</button><button class="chip" data-v="ice" aria-pressed="false">Ice</button><button class="chip" data-v="space" aria-pressed="false">Deep space</button></div>
        </div>
        <div class="panel" data-for="mass" hidden>
          <h2>Set up</h2>
          <p class="set-label">Object</p><div class="chip-group" id="obj" aria-label="Object" style="margin-bottom:12px"><button class="chip" data-v="ball" aria-pressed="true">Football</button><button class="chip" data-v="bowl" aria-pressed="false">Bowling ball</button><button class="chip" data-v="books" aria-pressed="false">Box of books</button><button class="chip" data-v="car" aria-pressed="false">Small car</button></div>
          <p class="set-label">Where</p><div class="chip-group" id="place" aria-label="Where" style="margin-bottom:12px"><button class="chip" data-v="earth" aria-pressed="true">Earth</button><button class="chip" data-v="moon" aria-pressed="false">Moon</button><button class="chip" data-v="space" aria-pressed="false">Deep space</button></div>
          <div class="num-row"><label for="pushF">Push</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: push">−</button><input type="number" id="pushF" min="1" max="200" step="any" data-inc="5" value="10" inputmode="decimal"><span class="unit">N</span><button data-step="1" aria-label="More: push">+</button></div></div>
        </div>
        <div class="panel" data-for="move mass">
          <label class="toggle" style="margin-bottom:0"><input type="checkbox" id="forces" checked> Show the forces</label>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
  </main>
