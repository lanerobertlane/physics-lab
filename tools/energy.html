  <style>
    #scene { aspect-ratio: 800 / 460; }
    .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
    .stage-bar .spacer { flex: 1; }
    .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: end; height: 200px; padding: 0 4px; border-bottom: 2px solid var(--text); }
    .bar { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
    .bar .fill { border-radius: 3px 3px 0 0; min-height: 1px; transition: height .05s linear; }
    .bar-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 6px 4px 0; text-align: center; font-size: .82rem; font-weight: 700; line-height: 1.2; }

<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Energy stores</h1>
      <p>Watch energy move between the kinetic, gravitational potential and thermal stores. Turn friction on to see energy being dissipated, but the total always stays the same.</p>
    </div>

    <div class="scene-picker btn-row" id="scenes" style="margin-bottom:12px"></div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="Energy simulation"></canvas>
          <div class="stage-bar">
            <button class="btn primary" id="play">▶ Play</button>
            <button class="btn" id="reset">↺ Reset</button>
            <div class="chip-group" id="speed" aria-label="Speed"><button class="chip" data-v="1" aria-pressed="true">Normal</button><button class="chip" data-v="0.5" aria-pressed="false">Slow</button><button class="chip" data-v="0.2" aria-pressed="false">Very slow</button></div>
            <span class="spacer"></span>
            <label class="toggle"><input type="checkbox" id="friction"> Friction &amp; air resistance</label>
          </div>
        </div>

        <div class="panel after-aside" id="graph-panel">
          <h2>Energy–time graph</h2>
          <canvas id="graph" aria-label="Energy against time"></canvas>
        </div>
      </div>

      <aside>
        <div class="panel">
          <h2>Energy stores</h2>
          <div class="bars" id="bars"></div>
          <div class="bar-labels" id="bar-labels"></div>
          <p class="transfer" id="transfer"></p>
        </div>

        <div class="panel">
          <h2>Working</h2>
          <div class="working" id="working" style="margin:0"></div>
        </div>

        <div class="panel">
          <h2>Settings</h2>
          <div class="num-row"><label for="mass">Mass</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: mass">−</button><input type="number" id="mass" min="0.5" max="5" step="any" data-inc="0.5" value="2" inputmode="decimal"><span class="unit">kg</span><button data-step="1" aria-label="More: mass">+</button></div></div>
          <div class="num-row"><label for="height">Starting height</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: starting height">−</button><input type="number" id="height" min="1" max="10" step="any" data-inc="0.5" value="5" inputmode="decimal"><span class="unit">m</span><button data-step="1" aria-label="More: starting height">+</button></div></div>
          <label class="toggle"><input type="checkbox" id="show-graph" checked> Show energy–time graph</label>
          <p class="note">Gravitational field strength g = 9.8 N/kg.</p>
        </div>
      </aside>
    </div>
  </main>
