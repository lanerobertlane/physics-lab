  <style>
    #scene { display: block; width: 100%; aspect-ratio: 800 / 440; }
    .stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
    .stage-bar .spacer { flex: 1; }
    #info p, #explain p { margin: 0 0 8px; line-height: 1.5; }
    #info p:last-child, #explain p:last-child { margin-bottom: 0; }
    #explain ul { margin: 0 0 8px; padding-left: 20px; }
    #explain li { margin-bottom: 4px; }
    .readout dd { white-space: nowrap; }
    .set-label { font-size: .88rem; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  </style>

<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Seismic waves</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="earth" aria-pressed="true">Through the Earth</button>
      <button class="chip" data-t="types" aria-pressed="false">P and S waves</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="A cut-away of the Earth with an earthquake"></canvas>
          <div class="stage-bar">
            <button class="btn primary" id="quake" data-for="earth">💥 Earthquake!</button>
            <button class="btn primary" id="shake" data-for="types" hidden>💥 Send a wave</button>
            <span class="spacer"></span>
          </div>
        </div>
        <div class="panel after-aside">
          <h2>How it works</h2>
          <div id="explain"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="earth">
          <h2>Set up</h2>
          <label class="toggle"><input type="checkbox" id="showp" checked> Show P waves</label>
          <label class="toggle"><input type="checkbox" id="shows" checked> Show S waves</label>
          <label class="toggle" style="margin-bottom:0"><input type="checkbox" id="layers" checked> Name the layers</label>
          <p class="note" style="margin:10px 0 0">Drag the earthquake to anywhere on the surface. Tap a seismometer to see what it records.</p>
        </div>
        <div class="panel" data-for="types" hidden>
          <h2>Set up</h2>
          <p class="set-label">The right-hand half is</p>
          <div class="chip-group" id="medium" aria-label="What the waves go into" style="margin-bottom:0"><button class="chip" data-v="solid" aria-pressed="true">Solid rock</button><button class="chip" data-v="liquid" aria-pressed="false">Liquid (like the outer core)</button></div>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/common.js"></script>

  <script src="../js/practice-tab.js"></script>
</body>
