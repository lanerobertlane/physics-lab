<body>
  <main class="tool-page">
    <div class="tool-intro">
      <h1>Power: comparing two motors</h1>
      <p id="intro"></p>
    </div>

    <div class="chip-group" id="tabs" style="margin-bottom:12px" aria-label="Show">
      <button class="chip" data-t="same" aria-pressed="true">The same job</button>
      <button class="chip" data-t="different" aria-pressed="false">Different jobs</button>
    </div>

    <div class="tool-layout">
      <div class="main-col">
        <div class="panel stage">
          <canvas id="scene" class="drag" aria-label="Two motors lifting loads, with a graph of energy transferred against time"></canvas>
          <div class="stage-bar">
            <button class="btn primary" id="go">▶ Go</button>
            <button class="btn" id="reset">↺ Reset</button>
            <span class="spacer"></span>
            <button class="btn" id="mystery">🎲 Mystery motors</button>
            <button class="btn" id="reveal" hidden>Show their power</button>
          </div>
        </div>
        <div class="panel after-aside">
          <h2>Results</h2>
          <div id="results"></div>
        </div>
      </div>
      <aside>
        <div class="panel" data-for="same">
          <h2>The job</h2>
          <p class="note" style="margin-top:0">Both motors lift the same load through the same height.</p>
          <div class="num-row"><label for="mass">Mass of the load</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: mass">−</button><input type="number" id="mass" min="0.5" max="50" step="any" data-inc="1" value="5" inputmode="decimal"><span class="unit">kg</span><button data-step="1" aria-label="More: mass">+</button></div></div>
          <div class="num-row"><label for="height">Height to lift it</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: height">−</button><input type="number" id="height" min="0.5" max="5" step="any" data-inc="0.5" value="2" inputmode="decimal"><span class="unit">m</span><button data-step="1" aria-label="More: height">+</button></div></div>
        </div>
        <div class="panel">
          <h2 class="motor-h"><span class="dot" style="background:#1e63c6"></span>Motor A</h2>
          <div data-for="different" hidden>
            <div class="num-row"><label for="massA">Mass of the load</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: mass for motor A">−</button><input type="number" id="massA" min="0.5" max="50" step="any" data-inc="1" value="5" inputmode="decimal"><span class="unit">kg</span><button data-step="1" aria-label="More: mass for motor A">+</button></div></div>
            <div class="num-row"><label for="heightA">Height to lift it</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: height for motor A">−</button><input type="number" id="heightA" min="0.5" max="5" step="any" data-inc="0.5" value="2" inputmode="decimal"><span class="unit">m</span><button data-step="1" aria-label="More: height for motor A">+</button></div></div>
          </div>
          <div class="power-row"><div class="num-row"><label for="powerA">Power</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: power of motor A">−</button><input type="number" id="powerA" min="5" max="500" step="any" data-inc="5" value="40" inputmode="decimal"><span class="unit">W</span><button data-step="1" aria-label="More: power of motor A">+</button></div></div></div>
          <p class="note mystery-note" hidden style="margin:0">Its power is a mystery. Time it, then work it out!</p>
        </div>
        <div class="panel">
          <h2 class="motor-h"><span class="dot" style="background:#e65100"></span>Motor B</h2>
          <div data-for="different" hidden>
            <div class="num-row"><label for="massB">Mass of the load</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: mass for motor B">−</button><input type="number" id="massB" min="0.5" max="50" step="any" data-inc="1" value="20" inputmode="decimal"><span class="unit">kg</span><button data-step="1" aria-label="More: mass for motor B">+</button></div></div>
            <div class="num-row"><label for="heightB">Height to lift it</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: height for motor B">−</button><input type="number" id="heightB" min="0.5" max="5" step="any" data-inc="0.5" value="2" inputmode="decimal"><span class="unit">m</span><button data-step="1" aria-label="More: height for motor B">+</button></div></div>
          </div>
          <div class="power-row"><div class="num-row"><label for="powerB">Power</label><div class="stepper" data-num><button data-step="-1" aria-label="Less: power of motor B">−</button><input type="number" id="powerB" min="5" max="500" step="any" data-inc="5" value="60" inputmode="decimal"><span class="unit">W</span><button data-step="1" aria-label="More: power of motor B">+</button></div></div></div>
          <p class="note mystery-note" hidden style="margin:0">Its power is a mystery. Time it, then work it out!</p>
        </div>
        <div class="panel">
          <h2>What’s happening</h2>
          <div id="info"></div>
        </div>
      </aside>
    </div>
